name: Build

on:
  push:
    branches:
      - 'version/**'
  pull_request:
    branches:
      - 'version/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OpenJDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-cleanup: true

      - name: Diagnose API drift
        run: |
          # Run gradle to download deps, then search the decompiled sources
          ./gradlew :neo:prepareNeoForgeRun 2>/dev/null || true

          echo "=== Searching decompiled MC sources ==="
          MC_SRC=$(find ~/.gradle/caches -name "minecraft-*-sources.jar" -path "*26.2*" 2>/dev/null | head -1)
          echo "MC sources jar: $MC_SRC"
          if [ -n "$MC_SRC" ]; then
            echo "--- MultiBufferSource ---"
            jar tf "$MC_SRC" | grep -i "MultiBufferSource\|BufferSource" | head -10
            echo "--- renderBuffers ---"
            jar tf "$MC_SRC" | grep -i "RenderBuffers\|renderBuffers" | head -10
            echo "--- Minecraft class methods ---"
            jar tf "$MC_SRC" | grep "client/Minecraft.java" | head -5
            echo "--- GuiGraphics ---"
            jar tf "$MC_SRC" | grep "GuiGraphics" | head -10
            echo "--- TagsProvider ---"
            jar tf "$MC_SRC" | grep -i "TagsProvider\|IntrinsicHolder" | head -20
            echo "--- ChatFormatting ---"
            jar tf "$MC_SRC" | grep "ChatFormatting" | head -5
            echo "--- RenderTarget ---"
            jar tf "$MC_SRC" | grep "RenderTarget" | head -10
            echo "--- PictureInPicture ---"
            jar tf "$MC_SRC" | grep -i "PictureInPicture" | head -10
            echo "--- VertexConsumer / BufferBuilder ---"
            jar tf "$MC_SRC" | grep -i "VertexConsumer\|BufferBuilder" | head -10
          fi

          echo ""
          echo "=== Searching NeoForge patches for clues ==="
          NF_JAR=$(find ~/.gradle/caches -name "neoforge-*-userdev.jar" -path "*26.2*" 2>/dev/null | head -1)
          echo "NeoForge userdev jar: $NF_JAR"
          if [ -n "$NF_JAR" ]; then
            echo "--- ItemTagsProvider source ---"
            jar xf "$NF_JAR" net/neoforged/neoforge/common/data/ItemTagsProvider.java 2>/dev/null && cat net/neoforged/neoforge/common/data/ItemTagsProvider.java | head -40
            echo "--- TagsProvider patch ---"
            jar tf "$NF_JAR" | grep "TagsProvider.*patch" | head -10
          fi
        continue-on-error: true

      - name: Build
        run: ./gradlew build
        continue-on-error: true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: modonomicon-jars
          path: |
            common/build/libs/*.jar
            fabric/build/libs/*.jar
            neo/build/libs/*.jar
          retention-days: 7
