name: Build

on:
  push:
    branches:
      - 'version/**'
  pull_request:
    branches:
      - 'version/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OpenJDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-cleanup: true

      - name: Diagnose API drift
        run: |
          echo "=== Searching for MultiBufferSource equivalent ==="
          find ~/.gradle/caches -name "*.jar" -path "*neoforge*26.2*" 2>/dev/null | head -5 | while read jar; do
            echo "--- JAR: $jar ---"
            jar tf "$jar" | grep -i "multibuffer\|buffersource\|BufferSource" | head -20
          done
          echo ""
          echo "=== Searching for renderBuffers/bufferSource ==="
          find ~/.gradle/caches -name "*.jar" -path "*neoforge*26.2*" 2>/dev/null | head -5 | while read jar; do
            jar tf "$jar" | grep -i "renderbuffer" | head -20
          done
          echo ""
          echo "=== Searching for IntrinsicHolderTagsProvider ==="
          find ~/.gradle/caches -name "*.jar" -path "*neoforge*26.2*" 2>/dev/null | head -5 | while read jar; do
            jar tf "$jar" | grep -i "intrinsicholder\|TagsProvider" | head -20
          done
          echo ""
          echo "=== Searching for pushGuiLayer/popGuiLayer ==="
          find ~/.gradle/caches -name "*.jar" -path "*minecraft*26.2*" 2>/dev/null | head -5 | while read jar; do
            jar tf "$jar" | grep -i "minecraft.*Minecraft" | head -5
          done
          echo ""
          echo "=== Searching for ChatFormatting ==="
          find ~/.gradle/caches -name "*.jar" -path "*minecraft*26.2*" 2>/dev/null | head -5 | while read jar; do
            jar tf "$jar" | grep -i "ChatFormatting\|TextColor" | head -20
          done
          echo ""
          echo "=== Searching for getMainRenderTarget ==="
          find ~/.gradle/caches -name "*.jar" -path "*minecraft*26.2*" 2>/dev/null | head -5 | while read jar; do
            jar tf "$jar" | grep -i "rendertarget\|RenderTarget" | head -20
          done
          echo ""
          echo "=== Searching for PictureInPictureRenderer ==="
          find ~/.gradle/caches -name "*.jar" -path "*minecraft*26.2*" 2>/dev/null | head -5 | while read jar; do
            jar tf "$jar" | grep -i "PictureInPicture" | head -20
          done
        continue-on-error: true

      - name: Build
        run: ./gradlew build
        continue-on-error: true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: modonomicon-jars
          path: |
            common/build/libs/*.jar
            fabric/build/libs/*.jar
            neo/build/libs/*.jar
          retention-days: 7
