name: Build

on:
  push:
    branches:
      - 'version/**'
  pull_request:
    branches:
      - 'version/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OpenJDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-cleanup: true

      - name: Diagnose API drift
        run: |
          MC_JAR="/home/runner/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft/minecraft-merged-deobf/26.2-snapshot-1/minecraft-merged-deobf-26.2-snapshot-1.jar"

          echo "=== Search for BufferSource ==="
          jar tf "$MC_JAR" | grep -i "BufferSource\|MultiBuffer" | head -20
          echo ""
          echo "=== Search for VertexConsumer ==="
          jar tf "$MC_JAR" | grep "VertexConsumer" | head -10
          echo ""
          echo "=== Search for RenderType getBuffer ==="
          javap -cp "$MC_JAR" -p net.minecraft.client.renderer.rendertype.RenderType 2>/dev/null | grep -i "buffer" | head -10
          echo ""
          echo "=== Search for GuiGraphics ==="
          javap -cp "$MC_JAR" -p net.minecraft.client.gui.GuiGraphics 2>/dev/null | grep -iE "buffer|render|pip" | head -15
          echo ""
          echo "=== PictureInPictureRenderer full ==="
          javap -cp "$MC_JAR" -p net.minecraft.client.gui.render.pip.PictureInPictureRenderer 2>/dev/null | head -30
          echo ""
          echo "=== RenderBuffers full ==="
          javap -cp "$MC_JAR" -p net.minecraft.client.renderer.RenderBuffers 2>/dev/null | head -30
          echo ""
          echo "=== Minecraft.screen ==="
          javap -cp "$MC_JAR" -p net.minecraft.client.Minecraft 2>/dev/null | grep -iE "screen|pushGui|popGui|setScreen" | head -20
          echo ""
          echo "=== GameRenderer ==="
          javap -cp "$MC_JAR" -p net.minecraft.client.renderer.GameRenderer 2>/dev/null | grep -iE "camera|feature|mainCamera" | head -15
          echo ""
          echo "=== LevelRenderer getLightCoords ==="
          javap -cp "$MC_JAR" -p net.minecraft.client.renderer.LevelRenderer 2>/dev/null | grep -i "lightCoord\|getLight" | head -10
          echo ""
          echo "=== RenderPipeline getters ==="
          javap -cp "$MC_JAR" -p com.mojang.blaze3d.pipeline.RenderPipeline 2>/dev/null | grep -iE "public|get" | head -20
          echo ""
          echo "=== VertexFormat methods ==="
          javap -cp "$MC_JAR" -p com.mojang.blaze3d.vertex.VertexFormat 2>/dev/null | grep -iE "upload|immediate" | head -10
          echo ""
          echo "=== MeshData.DrawState ==="
          javap -cp "$MC_JAR" -p com.mojang.blaze3d.vertex.MeshData 2>/dev/null | grep -i "draw\|mode\|index" | head -15
          echo ""
          echo "=== TagsProvider full ==="
          javap -cp "$MC_JAR" -p net.minecraft.data.tags.TagsProvider 2>/dev/null | head -40
          echo ""
          echo "=== ItemTagsProvider full ==="
          javap -cp "$MC_JAR" -p net.minecraft.data.tags.ItemTagsProvider 2>/dev/null | head -30
          echo ""
          echo "=== ChatFormatting getColor ==="
          javap -cp "$MC_JAR" -p net.minecraft.ChatFormatting 2>/dev/null | grep -iE "color|getCol" | head -10
          echo ""
          echo "=== Check if MultiBufferSource exists in merged deobf ==="
          jar tf "$MC_JAR" | grep "MultiBufferSource" | head -10
          echo ""
          echo "=== Check Minecraft class for screen field ==="
          javap -cp "$MC_JAR" -p net.minecraft.client.Minecraft 2>/dev/null | grep -E "screen|Screen" | head -10
          echo ""
          echo "=== Check NeoGuiHelper alternatives ==="
          javap -cp "$MC_JAR" -p net.minecraft.client.Minecraft 2>/dev/null | grep -iE "setScreen|pushScreen|popScreen|guiLayer" | head -10
          echo ""
          echo "=== GatherDataEvent.ItemTagsProvider ==="
          NF_UNI=$(find ~/.gradle/caches -name "neoforge-*-universal.jar" -path "*26.2*" 2>/dev/null | head -1)
          javap -cp "$NF_UNI" -p net.neoforged.neoforge.data.event.GatherDataEvent 2>/dev/null | grep -i "ItemTags\|tags" | head -10
          echo ""
          echo "=== NeoForge ItemTagsProvider ==="
          javap -cp "$NF_UNI" -p net.neoforged.neoforge.common.data.ItemTagsProvider 2>/dev/null | head -20
          echo ""
          echo "=== Check common compile classpath ==="
          # Look at what loom gives the common module
          COMMON_JARS=$(find ~/.gradle/caches/fabric-loom -name "*.jar" 2>/dev/null | grep "26.2" | head -10)
          echo "Loom jars: $COMMON_JARS"
          for J in $COMMON_JARS; do
            if jar tf "$J" 2>/dev/null | grep -q "MultiBufferSource"; then
              echo "  MultiBufferSource found in: $J"
            fi
          done
          echo ""
          echo "=== Check if common uses different minecraft jar ==="
          find ~/.gradle/caches -name "*.jar" -path "*minecraft*" 2>/dev/null | grep "26.2" | while read J; do
            HAS=$(jar tf "$J" 2>/dev/null | grep -c "MultiBufferSource" || true)
            echo "  $J -> $HAS MultiBufferSource entries"
          done
          echo ""
          echo "=== javap MultiBufferSource from deobf jar ==="
          DEOBF_JAR="/home/runner/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft/minecraft-merged-deobf/26.2-snapshot-1/minecraft-merged-deobf-26.2-snapshot-1.jar"
          javap -cp "$DEOBF_JAR" -p net.minecraft.client.renderer.MultiBufferSource 2>&1 | head -20
          echo ""
          echo "=== javap BufferSource from deobf jar ==="
          javap -cp "$DEOBF_JAR" -p 'net.minecraft.client.renderer.MultiBufferSource$BufferSource' 2>&1 | head -20
          echo ""
          echo "=== Check neo module's deobf jar ==="
          # The neo module uses ModDev which creates its own deobf jar
          NEO_DEOBF=$(find ~/.gradle/caches/neoformruntime -name "*.jar" 2>/dev/null | head -5)
          echo "NeoForm jars: $NEO_DEOBF"
          for J in $NEO_DEOBF; do
            HAS=$(jar tf "$J" 2>/dev/null | grep -c "MultiBufferSource" || true)
            echo "  $J -> $HAS MultiBufferSource entries"
            if [ "$HAS" -gt 0 ]; then
              jar tf "$J" | grep "MultiBufferSource"
            fi
          done
          echo ""
          echo "=== Check ModDev decompiled sources ==="
          MODDEV_SRC=$(find ~/.gradle/caches -name "*.jar" -path "*moddev*" 2>/dev/null | head -5)
          echo "ModDev jars: $MODDEV_SRC"
          echo ""
          echo "=== Search ALL jars for MultiBufferSource ==="
          find ~/.gradle/caches -name "*.jar" 2>/dev/null | while read J; do
            HAS=$(jar tf "$J" 2>/dev/null | grep -c "MultiBufferSource" || true)
            if [ "$HAS" -gt 0 ]; then
              echo "  FOUND in: $J ($HAS entries)"
            fi
          done
          echo ""
          echo "=== Common module classpath (from task properties) ==="
          # Use gradle task properties to get the actual classpath
          cat > /tmp/printcp.gradle << 'GRADLE'
          allprojects {
              afterEvaluate {
                  tasks.matching { it.name == 'compileJava' }.configureEach {
                      doLast {
                          println "=== ${project.name} compileJava classpath ==="
                          classpath.files.each { f ->
                              if (f.name.contains("minecraft") || f.name.contains("neoforge")) {
                                  println "  ${f.absolutePath}"
                              }
                          }
                      }
                  }
              }
          }
          GRADLE
          ./gradlew -I /tmp/printcp.gradle :common:compileJava :neo:compileJava 2>&1 | grep -E "===.*classpath|minecraft|neoforge" | grep -v "^$"
        continue-on-error: true

      - name: Build
        run: ./gradlew build
        continue-on-error: true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: modonomicon-jars
          path: |
            common/build/libs/*.jar
            fabric/build/libs/*.jar
            neo/build/libs/*.jar
          retention-days: 7
