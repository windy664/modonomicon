name: Build

on:
  push:
    branches:
      - 'version/**'
  pull_request:
    branches:
      - 'version/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OpenJDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-cleanup: true

      - name: Diagnose API drift
        run: |
          # Find the patched MC jar from the neo build
          MC_JAR=$(find . -name "minecraft-client-patched-*.jar" 2>/dev/null | head -1)
          if [ -z "$MC_JAR" ]; then
            MC_JAR=$(find ~/.gradle/caches -name "minecraft-client-patched-*.jar" 2>/dev/null | head -1)
          fi
          echo "MC jar: $MC_JAR"

          if [ -n "$MC_JAR" ]; then
            echo "=== BufferBuilder constructor ==="
            javap -cp "$MC_JAR" -p com.mojang.blaze3d.vertex.BufferBuilder 2>/dev/null | grep -i "BufferBuilder\|build\|vertexFormat" | head -15
            echo ""
            echo "=== RenderPipeline methods ==="
            javap -cp "$MC_JAR" -p com.mojang.blaze3d.pipeline.RenderPipeline 2>/dev/null | head -30
            echo ""
            echo "=== Minecraft methods (gui/render related) ==="
            javap -cp "$MC_JAR" -p net.minecraft.client.Minecraft 2>/dev/null | grep -i "pushGui\|popGui\|screen\|renderBuffer\|bufferSource\|mainRender\|getMain" | head -20
            echo ""
            echo "=== ChatFormatting methods ==="
            javap -cp "$MC_JAR" -p net.minecraft.ChatFormatting 2>/dev/null | grep -i "color\|getCol" | head -10
            echo ""
            echo "=== PictureInPictureRenderer ==="
            javap -cp "$MC_JAR" -p net.minecraft.client.gui.render.pip.PictureInPictureRenderer 2>/dev/null | head -20
            echo ""
            echo "=== TagsProvider ==="
            javap -cp "$MC_JAR" -p net.minecraft.data.tags.TagsProvider 2>/dev/null | head -30
            echo ""
            echo "=== IntrinsicHolderTagsProvider ==="
            javap -cp "$MC_JAR" -p net.minecraft.data.tags.IntrinsicHolderTagsProvider 2>/dev/null | head -20
            echo ""
            echo "=== ItemTagsProvider ==="
            javap -cp "$MC_JAR" -p net.minecraft.data.tags.ItemTagsProvider 2>/dev/null | head -20
            echo ""
            echo "=== RenderBuffers ==="
            javap -cp "$MC_JAR" -p net.minecraft.client.renderer.RenderBuffers 2>/dev/null | grep -i "buffer" | head -15
            echo ""
            echo "=== RenderTarget ==="
            javap -cp "$MC_JAR" -p com.mojang.blaze3d.pipeline.RenderTarget 2>/dev/null | head -20
          fi
        continue-on-error: true

      - name: Build
        run: ./gradlew build
        continue-on-error: true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: modonomicon-jars
          path: |
            common/build/libs/*.jar
            fabric/build/libs/*.jar
            neo/build/libs/*.jar
          retention-days: 7
